{{ $style := resources.Get "scss/custom.scss" | toCSS }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}">

<nav role="navigation" aria-label="Main navigation">
    <div class="container">
        <div class="nav-container">
            <!-- Logo offset 10vw from left -->
            <a href="{{ .Site.BaseURL }}" class="logo" aria-label="{{ .Site.Title }} - Home">{{ .Site.Params.logo | default "GP" }}</a>

            <!-- Trigger Button -->
            <button class="hamburger-btn header-trigger" id="hamburger-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Open navigation menu">
                ☰
            </button>

            <!-- Slide Drawer -->
            <div class="nav-dropdown" id="nav-menu">
                <div class="drawer-header">
                    <button class="hamburger-btn drawer-trigger" id="hamburger-close" aria-label="Close navigation menu">
                        ☰
                    </button>
                </div>

                <!-- Hardcoded links with forced inline display styles -->
                <ul class="nav-links" style="display: flex !important; flex-direction: column !important; visibility: visible !important; opacity: 1 !important;">
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}" style="display: block !important; color: #ffffff !important; visibility: visible !important;">Home</a></li>
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}social/" style="display: block !important; color: #ffffff !important; visibility: visible !important;">Social</a></li>
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}posts/" style="display: block !important; color: #ffffff !important; visibility: visible !important;">Blog</a></li>
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}portfolio/" style="display: block !important; color: #ffffff !important; visibility: visible !important;">Portfolio</a></li>
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}about/" style="display: block !important; color: #ffffff !important; visibility: visible !important;">About</a></li>
                    <li style="display: block !important; visibility: visible !important;"><a href="{{ .Site.BaseURL }}travel/" style="display: block !important; color: #ffffff !important; visibility: visible !important;">Travel</a></li>
                </ul>
            </div>

            <!-- Dark Overlay Backdrop -->
            <div class="nav-overlay" id="nav-overlay"></div>
        </div>
    </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('hamburger-toggle');
    const closeBtn = document.getElementById('hamburger-close');
    const menu = document.getElementById('nav-menu');
    const overlay = document.getElementById('nav-overlay');

    function toggleMenu() {
      const isOpen = menu.classList.toggle('active');
      if (overlay) overlay.classList.toggle('active');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', isOpen);
    }

    if (toggleBtn) toggleBtn.addEventListener('click', toggleMenu);
    if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
    if (overlay) overlay.addEventListener('click', toggleMenu);
  });
</script>
