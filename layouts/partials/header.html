{{ $style := resources.Get "scss/custom.scss" | toCSS }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}">

<nav role="navigation" aria-label="Main navigation">
    <div class="nav-container">
        
        <!-- Logo Link & Image -->
        <a href="{{ .Site.BaseURL }}" class="logo" aria-label="{{ .Site.Title }} - Home">
            {{ if .Site.Params.logo }}
                <img src="{{ .Site.Params.logo | relURL }}" alt="{{ .Site.Title }} Logo" class="logo-img" />
            {{ else }}
                <span style="font-size: 1.8rem; font-weight: bold; color: #fff;">{{ .Site.Title }}</span>
            {{ end }}
        </a>

        <!-- Open Drawer Trigger Button -->
        <button class="hamburger-btn header-trigger" id="hamburger-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Open navigation menu">
            ☰
        </button>

        <!-- Off-Canvas Drawer Panel -->
        <div class="nav-dropdown" id="nav-menu">
            <div class="drawer-header">
                <button class="hamburger-btn drawer-trigger" id="hamburger-close" aria-label="Close navigation menu">
                    ✕
                </button>
            </div>

            <!-- TOP-ALIGNED NAVIGATION LINKS -->
            <ul class="nav-links">
                <li><a href="{{ .Site.BaseURL }}">Home</a></li>
                <li><a href="{{ .Site.BaseURL }}social/">Social</a></li>
                <li><a href="{{ .Site.BaseURL }}posts/">Blog</a></li>
                <li><a href="{{ .Site.BaseURL }}portfolio/">Portfolio</a></li>
                <li><a href="{{ .Site.BaseURL }}about/">About</a></li>
                <li><a href="{{ .Site.BaseURL }}travel/">Travel</a></li>
            </ul>
        </div>

        <!-- Dark Backdrop Overlay -->
        <div class="nav-overlay" id="nav-overlay"></div>
    </div>
</nav>

<script>
  (function() {
    function setupMobileMenu() {
      const menu = document.getElementById('nav-menu');
      const overlay = document.getElementById('nav-overlay');

      // Move menu and overlay under <body> so theme container overflow doesn't clip it
      if (menu && menu.parentElement !== document.body) {
        document.body.appendChild(menu);
      }
      if (overlay && overlay.parentElement !== document.body) {
        document.body.appendChild(overlay);
      }
    }

    // Toggle menu state helper
    function toggleNav() {
      const menu = document.getElementById('nav-menu');
      const overlay = document.getElementById('nav-overlay');
      const toggleBtn = document.getElementById('hamburger-toggle');

      if (!menu) return;

      const isOpen = menu.classList.toggle('active');
      if (overlay) overlay.classList.toggle('active');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', isOpen);
    }

    // Global Click Delegation (Ignores timing or DOM modification issues)
    document.addEventListener('click', function(e) {
      const target = e.target;
      
      if (target.closest('#hamburger-toggle') || target.closest('#hamburger-close') || target.closest('#nav-overlay')) {
        e.preventDefault();
        toggleNav();
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupMobileMenu);
    } else {
      setupMobileMenu();
    }
  })();
</script>
