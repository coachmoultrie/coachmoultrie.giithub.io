{{ $style := resources.Get "scss/custom.scss" | toCSS }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}">

<nav role="navigation" aria-label="Main navigation">
    <div class="container">
        <div class="nav-container">
            <!-- Logo on the far left -->
            <a href="{{ .Site.BaseURL }}" class="logo" aria-label="{{ .Site.Title }} - Home">{{ .Site.Params.logo | default "GP" }}</a>
            
            <!-- Static Trigger Button (Visible when drawer is closed) -->
            <button class="hamburger-btn static-btn" id="hamburger-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
                ☰
            </button>

            <!-- 30vw Off-Canvas Slide-Out Drawer -->
            <div class="nav-dropdown" id="nav-menu">
                <!-- Close/Toggle Button inside the drawer (Slides WITH the panel) -->
                <button class="hamburger-btn drawer-btn" id="hamburger-close" aria-label="Close navigation menu">
                    ✕
                </button>

                <ul class="nav-links">
                    <li><a href="{{ .Site.BaseURL }}" aria-current="false">{{ i18n "home" }}</a></li>
                    <li><a href="{{ .Site.BaseURL }}social/" aria-current="false">{{ i18n "social" }}</a></li>
                    <li><a href="{{ .Site.BaseURL }}posts/" aria-current="false">{{ i18n "blog" }}</a></li>
                    <li><a href="{{ .Site.BaseURL }}portfolio/" aria-current="false">{{ i18n "portfolio" }}</a></li>
                    <li><a href="{{ .Site.BaseURL }}about/" aria-current="false">{{ i18n "about" }}</a></li>
                    <li><a href="{{ .Site.BaseURL }}travel/" aria-current="false">{{ i18n "travel" }}</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('hamburger-toggle');
    const closeBtn = document.getElementById('hamburger-close');
    const menu = document.getElementById('nav-menu');

    function toggleMenu() {
      const isOpen = menu.classList.toggle('active');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', isOpen);
    }

    if (toggleBtn) toggleBtn.addEventListener('click', toggleMenu);
    if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
  });
</script>
