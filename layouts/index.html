{{ define "main" }}
<!-- Section 1: Hero area with image1.JPG -->
<section class="hero section-first">
    <div class="hero-content">
        <h1>{{ i18n "hero_greeting" }} {{ .Site.Params.author | default "m03315" }}</h1>
        <p>{{ .Site.Params.subtitle | default "数字游民 • 科技探索者 • 生活记录者" }}</p>
        <p>{{ .Site.Params.description | default "分享科技前沿见解，记录数字游民生活，提供实用攻略指南" }}</p>
        <div class="cta-buttons">
            <a href="{{ .Site.BaseURL }}social/" class="btn btn-primary">{{ i18n "follow_social" }}</a>
            <a href="{{ .Site.BaseURL }}about/" class="btn btn-secondary">{{ i18n "learn_more" }}</a>
        </div>
    </div>
</section>

<!-- Section 2: Secondary area with image2.jpeg directly underneath -->
<section class="section-second">
    <div class="section-content">
        <!-- Add any content you want over the second background image here -->
    </div>
</section>
{{ end }}
